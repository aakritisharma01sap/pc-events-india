<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>P&amp;C Event Orchestrator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f9;min-height:100vh}
.hidden{display:none!important}
/* Header */
.app-header{background:#00144A;height:52px;display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:100}
.app-header img{height:26px}
.app-header .title{color:#fff;font-size:15px;font-weight:700;flex:1}
.app-header .user{color:#c9d8e8;font-size:13px;margin-right:8px}
.app-header a.signout{color:#89d1ff;font-size:12px;text-decoration:none;cursor:pointer}
/* Nav */
.app-nav{background:#001a5e;display:flex;gap:2px;padding:0 24px}
.nav-link{color:#89d1ff;font-size:13px;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;text-decoration:none}
.nav-link:hover,.nav-link.active{color:#fff;border-bottom-color:#0064d9}
/* Event tabs */
.event-tabs{display:flex;gap:2px;padding:0 24px;background:#fff;border-bottom:1px solid #e0e7ef}
.tab-link{font-size:13px;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;color:#556b82}
.tab-link:hover,.tab-link.active{color:#0064d9;border-bottom-color:#0064d9}
/* Main */
.main{max-width:1100px;margin:0 auto;padding:24px}
/* Cards */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-header h1{font-size:20px;font-weight:700;color:#1d2d3e}
.page-header .sub{font-size:13px;color:#788fa5;margin-top:2px}
.event-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.event-card{background:#fff;border-radius:10px;border:1px solid #e0e7ef;border-left:5px solid #0064d9;padding:18px 20px;cursor:pointer;transition:box-shadow .15s;text-decoration:none;display:block}
.event-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.1)}
.event-card.s-planning{border-left-color:#0064d9}
.event-card.s-confirmed{border-left-color:#7c3aed}
.event-card.s-active{border-left-color:#22a06b}
.event-card.s-completed{border-left-color:#94a3b8}
.event-card.s-cancelled{border-left-color:#e53e3e}
.ec-name{font-size:15px;font-weight:700;color:#1d2d3e;margin-bottom:4px}
.ec-meta{font-size:12px;color:#788fa5;margin-bottom:10px}
.ec-stats{display:flex;gap:12px;flex-wrap:wrap}
.ec-stat{font-size:12px;color:#556b82}
.ec-stat strong{color:#1d2d3e}
/* Badges */
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700}
.badge-planning{background:#dbeafe;color:#1e40af}
.badge-confirmed{background:#ede9fe;color:#5b21b6}
.badge-active{background:#dcfce7;color:#166534}
.badge-completed{background:#f1f5f9;color:#475569}
.badge-cancelled{background:#fee2e2;color:#991b1b}
.badge-pending{background:#f1f5f9;color:#475569}
.badge-in_progress{background:#dbeafe;color:#1e40af}
.badge-blocked{background:#fee2e2;color:#991b1b}
.badge-done{background:#dcfce7;color:#166534}
.badge-na{background:#f1f5f9;color:#94a3b8}
/* Buttons */
.btn{display:inline-block;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:background .15s}
.btn-primary{background:#0064d9;color:#fff;border-color:#0064d9}
.btn-primary:hover{background:#0051b0}
.btn-ghost{background:#fff;color:#1d2d3e;border-color:#c5d0de}
.btn-ghost:hover{background:#f0f4f9}
.btn-danger{background:#e53e3e;color:#fff;border-color:#e53e3e}
.btn-danger:hover{background:#c0392b}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
/* Forms */
.form-card{background:#fff;border-radius:10px;border:1px solid #e0e7ef;padding:28px 32px;max-width:620px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:700;color:#3a4a5a;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid #c5d0de;border-radius:6px;font-size:14px;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#0064d9}
/* Table */
.table-wrap{background:#fff;border-radius:10px;border:1px solid #e0e7ef;overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#556b82;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #e0e7ef}
td{padding:10px 14px;border-bottom:1px solid #f0f4f9;vertical-align:middle;color:#1d2d3e}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
td input,td select{padding:4px 8px;border:1px solid #c5d0de;border-radius:4px;font-size:12px;width:100%}
/* Stats row */
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-chip{background:#fff;border:1px solid #e0e7ef;border-radius:8px;padding:12px 18px;min-width:80px;text-align:center}
.stat-val{font-size:22px;font-weight:700;color:#1d2d3e}
.stat-lbl{font-size:11px;color:#788fa5;text-transform:uppercase;letter-spacing:.4px}
/* Workstream accordion */
.ws-section{background:#fff;border:1px solid #e0e7ef;border-radius:10px;margin-bottom:12px;overflow:hidden}
.ws-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #e0e7ef}
.ws-header:hover{background:#fafbfc}
.ws-name{font-size:14px;font-weight:700;color:#1d2d3e;flex:1}
.ws-lead{font-size:12px;color:#788fa5}
.ws-toggle{font-size:12px;color:#788fa5;margin-left:4px}
.ws-body{padding:0 0 8px}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:28px 32px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:700;color:#1d2d3e;margin-bottom:4px}
.modal-sub{font-size:13px;color:#788fa5;margin-bottom:20px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
/* Login */
#loginScreen,#setupScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:36px 40px;width:100%;max-width:400px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login-logo img{height:28px}
.login-logo span{font-size:14px;font-weight:700;color:#556b82}
.login-title{font-size:22px;font-weight:700;color:#1d2d3e;margin-bottom:4px}
.login-sub{font-size:13px;color:#788fa5;margin-bottom:24px}
.role-pills{display:flex;gap:8px;margin-bottom:20px}
.role-pill{padding:6px 16px;border-radius:20px;border:1.5px solid #c5d0de;background:#f8fafc;color:#475569;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.role-pill.active{background:#00144A;color:#fff;border-color:#00144A}
.login-btn{width:100%;padding:11px;background:#0064d9;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.login-btn:hover{background:#0051b0}
.login-err{background:#fff0f0;border:1px solid #f5c6c6;color:#c0392b;border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
.login-footer{text-align:center;font-size:11px;color:#b0bec5;margin-top:20px}
/* Toast */
#toast{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast-msg{padding:12px 18px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;min-width:240px;animation:slideIn .2s ease}
.toast-success{background:#22a06b}
.toast-error{background:#e53e3e}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
/* PIN reveal */
.pin-box{background:#f0fdf4;border:2px solid #22a06b;border-radius:8px;padding:12px 16px;font-size:20px;font-weight:700;color:#166534;text-align:center;letter-spacing:4px;margin:12px 0}
/* RAG */
.rag-bar{height:6px;border-radius:3px;background:#e8edf4;margin:8px 0;overflow:hidden}
.rag-fill{height:100%;border-radius:3px}
.rag-green .rag-fill{background:#22a06b}
.rag-amber .rag-fill{background:#f59e0b}
.rag-red .rag-fill{background:#e53e3e}
.rag-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.rag-dot.green{background:#22a06b}.rag-dot.amber{background:#f59e0b}.rag-dot.red{background:#e53e3e}
/* Empty state */
.empty{text-align:center;padding:48px 20px;color:#788fa5}
.empty-icon{font-size:40px;margin-bottom:12px}
/* Budget totals */
.budget-total{background:#f8fafc;padding:10px 14px;border-top:2px solid #e0e7ef;font-weight:700;display:flex;gap:20px}
.budget-variance.pos{color:#22a06b}.budget-variance.neg{color:#e53e3e}
/* Logistics category */
.logi-cat-header{font-size:11px;font-weight:700;color:#788fa5;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #f0f4f9}
/* Settings sections */
.settings-section{background:#fff;border-radius:10px;border:1px solid #e0e7ef;padding:24px;margin-bottom:20px}
.settings-section h3{font-size:15px;font-weight:700;color:#1d2d3e;margin-bottom:4px}
.settings-section .desc{font-size:13px;color:#788fa5;margin-bottom:16px}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setupScreen" class="hidden">
  <div class="login-card">
    <div class="login-logo">
      <img src="static/images/sap_logo.png" alt="SAP" onerror="this.style.display='none'"/>
      <span>P&amp;C Event Orchestration</span>
    </div>
    <div id="setupContent"></div>
  </div>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="hidden">
  <div class="login-card">
    <div class="login-logo">
      <img src="static/images/sap_logo.png" alt="SAP" onerror="this.style.display='none'"/>
      <span>P&amp;C Event Orchestration</span>

      <button class="role-pill" onclick="selectRole('leader')">Leader</button>

    </div>
    <div class="login-err" id="loginErr"></div>
    <div id="loginUsernameRow" class="form-group hidden"><label>Username</label><input id="loginUsername" autocomplete="off"/></div>
    <div class="form-group"><label>Password</label><input id="loginPw" type="password" autocomplete="off"/></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-footer">SAP Internal · P&amp;C Team</div>
  </div>
</div>

<!-- PM SHELL -->
<div id="pmShell" class="hidden">
  <div class="app-header">
    <img src="static/images/sap_logo.png" alt="SAP" style="height:26px" onerror="this.style.display='none'"/>
    <span class="title">P&amp;C Event Orchestration</span>
    <span class="user" id="pmUserName"></span>
    <a class="signout" onclick="logout()">Sign out</a>
  </div>
  <div class="app-nav">
    <a class="nav-link" onclick="navigate('pm/dashboard')" id="nav-dashboard">Events</a>
    <a class="nav-link" onclick="navigate('pm/settings')" id="nav-settings">Settings</a>
  </div>
  <div id="pmEventTabs" class="event-tabs hidden"></div>
  <div class="main" id="pmMain"></div>
</div>

<!-- LEADER SHELL -->
<div id="leaderShell" class="hidden">
  <div class="app-header">
    <img src="static/images/sap_logo.png" alt="SAP" style="height:26px" onerror="this.style.display='none'"/>
    <span class="title">P&amp;C Event Orchestration — Leaders View</span>
    <span class="user" id="leaderUserName"></span>
    <a class="signout" onclick="logout()">Sign out</a>
  </div>
  <div class="main" id="leaderMain"></div>
</div>

<!-- PARTICIPANT SHELL -->
<div id="participantShell" class="hidden">
  <div class="app-header">
    <img src="static/images/sap_logo.png" alt="SAP" style="height:26px" onerror="this.style.display='none'"/>
    <span class="title">P&amp;C Event Orchestration</span>
    <span class="user" id="partUserName"></span>
    <a class="signout" onclick="logout()">Sign out</a>
  </div>
  <div class="main" id="partMain"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODALS -->
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

// ─── CRYPTO ──────────────────────────────────────────────────────────────────
async function decryptToken(cipher, pw) {
  const enc = new TextEncoder();
  const raw = Uint8Array.from(atob(cipher), c => c.charCodeAt(0));
  const iv = raw.slice(0,12), ct = raw.slice(12);
  const km = await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:enc.encode("sap-promo-salt-v1"),iterations:100000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return new TextDecoder().decode(pt);
}

async function hashPassword(pw, role) {
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest("SHA-256", enc.encode(role+"::"+pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ─── GITHUB API ──────────────────────────────────────────────────────────────
async function ghFetch(path, opts={}) {
  const res = await fetch(API+path, {
    headers:{Authorization:"token "+S.token,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},
    ...opts, body:opts.body?JSON.stringify(opts.body):undefined
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw Object.assign(new Error(res.statusText),{status:res.status,data:e});}
  return res.json();
}
async function readFile(path) {
  const d = await ghFetch(`/repos/${REPO}/contents/${path}?ref=${BRANCH}`);
  return {content:JSON.parse(atob(d.content.replace(/\n/g,""))),sha:d.sha};
}
async function writeFile(path,content,sha,msg) {
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2))));
  await ghFetch(`/repos/${REPO}/contents/${path}`,{method:"PUT",body:{message:msg,content:b64,sha,branch:BRANCH}});
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
async function navigate(path) {
  S.path=path;
  const parts=path.split("/");
  if(parts[0]==="pm") {
    document.querySelectorAll(".nav-link").forEach(l=>l.classList.remove("active"));
    if(path==="pm/dashboard"||path==="pm/event/new"){document.getElementById("nav-dashboard").classList.add("active");document.getElementById("pmEventTabs").classList.add("hidden");}
    if(path==="pm/settings"){document.getElementById("nav-settings").classList.add("active");document.getElementById("pmEventTabs").classList.add("hidden");}
    if(path==="pm/dashboard") return renderPMDashboard();
    if(path==="pm/event/new") return renderEventForm();
    if(parts[1]==="event"&&parts[2]!=="new") {
      S.eventId=parts[2];
      S.tab=parts[3]||"tasks";
      renderEventTabs();
      document.getElementById("nav-dashboard").classList.add("active");
      if(S.tab==="tasks") return renderTasks();
      if(S.tab==="budget") return renderBudget();
      if(S.tab==="logistics") return renderLogistics();
      if(S.tab==="agenda") return renderAgenda();
      if(S.tab==="links") return renderLinks();
    }
    if(path==="pm/settings") return renderSettings();
  }
  if(parts[0]==="leader") {
    if(path==="leader/dashboard") return renderLeaderDashboard();
    if(parts[1]==="event") {S.eventId=parts[2];return renderLeaderEvent();}
  }
  if(parts[0]==="participant") {
    if(path==="participant/dashboard") return renderParticipantDashboard();
    if(parts[1]==="event") {S.eventId=parts[2];return renderParticipantTasks();}
  }
}

async function doUnlock() {
  const pw=document.getElementById("masterPw").value.trim();
  const err=document.getElementById("setupErr");
  err.style.display="none";
  if(!pw){err.textContent="Enter the master password.";err.style.display="block";return;}
  try {
    const tok=await decryptToken(BAKED_TOKEN_CIPHER,pw);
    S.token=tok;
    sessionStorage.setItem("pc_token",tok);
    document.getElementById("setupScreen").classList.add("hidden");
    showLogin();
  } catch(e) {
    err.textContent="Incorrect password. Try again.";err.style.display="block";
  }
}

function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  setTimeout(()=>document.getElementById("loginPw")&&document.getElementById("loginPw").focus(),100);
}

function selectRole(r) {
  S.loginRole=r;
  document.querySelectorAll(".role-pill").forEach((p,i)=>p.classList.toggle("active",["pm","leader","participant"][i]===r));
  const usernameRow=document.getElementById("loginUsernameRow");
  if(r==="participant"){usernameRow.classList.remove("hidden");document.getElementById("loginUsername").focus();}
  else{usernameRow.classList.add("hidden");document.getElementById("loginPw").focus();}
}

async function doLogin() {
  const pw=document.getElementById("loginPw").value;
  const err=document.getElementById("loginErr");
  err.style.display="none";
  if(!pw){err.textContent="Enter your password.";err.style.display="block";return;}

  if(S.loginRole==="pm") {
    const h=await hashPassword(pw,"pm");
    if(h!==PM_PASS_HASH){err.textContent="Incorrect password.";err.style.display="block";document.getElementById("loginPw").value="";return;}
    S.user={username:"pm",name:"PM",role:"pm"};
    localStorage.setItem("pc_pm_session",JSON.stringify({username:"pm",name:"PM"}));
    document.getElementById("loginScreen").classList.add("hidden");
    enterShell(); return;
  }

  if(S.loginRole==="leader") {
    const h=await hashPassword(pw,"leader");
    if(h!==LEADER_PASS_HASH){err.textContent="Incorrect password.";err.style.display="block";document.getElementById("loginPw").value="";return;}
    S.user={username:"leader",name:"Leader",role:"leader"};
    localStorage.setItem("pc_leader_session",JSON.stringify({username:"leader",name:"Leader"}));
    document.getElementById("loginScreen").classList.add("hidden");
    enterShell(); return;
  }

  // Participant: username + password
  const username=(document.getElementById("loginUsername").value||"").trim();
  if(!username){err.textContent="Enter your username.";err.style.display="block";return;}
  try {
    const {content:users}=await loadUsers();
    const entry=users[username];
    if(!entry){err.textContent="Username not found. Ask the PM to add you.";err.style.display="block";return;}
    const h=await hashPassword(pw,"participant");
    if(h!==entry.pwHash){err.textContent="Incorrect password.";err.style.display="block";document.getElementById("loginPw").value="";return;}
    S.user={username,name:entry.name||username,role:"participant"};
    localStorage.setItem("pc_participant_session",JSON.stringify({username,name:entry.name||username}));
    document.getElementById("loginScreen").classList.add("hidden");
    enterShell();
  } catch(e){err.textContent="Error connecting to GitHub: "+e.message;err.style.display="block";}
}

function enterShell() {
  const r=S.user.role;
  if(r==="pm"){
    document.getElementById("pmUserName").textContent=S.user.name;
    document.getElementById("pmShell").classList.remove("hidden");
    navigate("pm/dashboard");
  } else if(r==="leader"){
    document.getElementById("leaderUserName").textContent=S.user.name;
    document.getElementById("leaderShell").classList.remove("hidden");
    navigate("leader/dashboard");
  } else {
    document.getElementById("partUserName").textContent=S.user.name;
    document.getElementById("participantShell").classList.remove("hidden");
    navigate("participant/dashboard");
  }
}

function logout() {
  ["pm","leader","participant"].forEach(r=>localStorage.removeItem(`pc_${r}_session`));
  sessionStorage.removeItem("pc_token");
  S.token=null;S.user=null;S.events=null;S.users=null;
  S.ws={};S.tasks={};S.budget={};S.logistics={};S.sessions={};S.links={};
  document.getElementById("pmShell").classList.add("hidden");
  document.getElementById("leaderShell").classList.add("hidden");
  document.getElementById("participantShell").classList.add("hidden");
  showSetup();
}

}

function renderWSHtml(ws,tasks) {
  if(!ws.length)return`<div class="empty"><div class="empty-icon">📋</div><p>No workstreams yet.<br>Click <strong>⚡ Load Full Template</strong> to pre-fill 7 workstreams with ~50 tasks,<br>or <strong>+ Add Workstream</strong> to create one manually.</p></div>`;
  return ws.map(w=>{
    const wtasks=tasks.filter(t=>String(t.ws_id)===String(w.id));
    const wdone=wtasks.filter(t=>t.status==="done").length;
    return `<div class="ws-section">
      <div class="ws-header" onclick="toggleWS(this)">
        <span class="ws-name">${esc(w.name)}</span>
        ${w.lead?`<span class="ws-lead">${esc(w.lead)}</span>`:""}
        <span class="badge badge-${w.status||"not_started"}">${(w.status||"not started").replace("_"," ")}</span>
        <span style="font-size:12px;color:#788fa5;margin-left:8px">${wdone}/${wtasks.length}</span>
        <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="event.stopPropagation();openEditWS(${w.id})">Edit</button>
        <button class="btn btn-ghost btn-sm" style="margin-left:4px;color:#e53e3e" onclick="event.stopPropagation();deleteWS(${w.id})">×</button>
        <span class="ws-toggle">▾</span>
      </div>
      <div class="ws-body">
        <table style="width:100%">
          <tr><th>Task</th><th>Owner</th><th>Due</th><th>Status</th><th></th></tr>
          ${wtasks.map(t=>`<tr id="tr-${t.id}">
            <td style="max-width:300px">
              <div style="font-weight:600">${esc(t.name)}</div>
              ${t.comments?`<div style="font-size:11px;color:#788fa5;margin-top:2px">${esc(t.comments)}</div>`:""}
            </td>
            <td><input style="width:130px" value="${esc(t.owner||"")}" placeholder="Assign…" onblur="patchTask(${t.id},'owner',this.value)" onkeydown="if(event.key==='Enter')this.blur()"/></td>
            <td><input type="date" style="width:130px" value="${esc(t.due_date||"")}" onchange="patchTask(${t.id},'due_date',this.value)"/></td>
            <td><select onchange="patchTask(${t.id},'status',this.value)">
              ${["pending","in_progress","blocked","done","na"].map(s=>`<option value="${s}"${t.status===s?" selected":""}>${s.replace("_"," ")}</option>`).join("")}
            </select></td>
            <td><button class="btn btn-ghost btn-sm" style="color:#e53e3e" onclick="deleteTask(${t.id})">×</button></td>
          </tr>`).join("")}
        </table>
        <div style="padding:8px 14px">
          <button class="btn btn-ghost btn-sm" onclick="openAddTask(${w.id})">+ Add Task</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function toggleWS(header) {

}

      </div>`;
  } catch(e){el.innerHTML=`<div class="empty"><p style="color:#e53e3e">Error: ${esc(e.message)}</p></div>`;}
}

async function addParticipant() {
  const name=document.getElementById("regName").value.trim();
  const username=document.getElementById("regUser").value.trim();
  const pw=document.getElementById("regPw").value;
  if(!name||!username||!pw){toast("Fill in all three fields","error");return;}
  try {
    const r=await readFile("users.json");
    const users=r.content;
    if(users[username]){toast("Username already exists","error");return;}
    const pwHash=await hashPassword(pw,"participant");
    users[username]={name,pwHash,role:"participant",addedAt:new Date().toISOString()};
    await saveUsers(users,r.sha);
    toast(`${name} added — username: ${username}`);
    document.getElementById("regName").value="";
    document.getElementById("regUser").value="";
    document.getElementById("regPw").value="";
    renderSettings();
  } catch(e){toast("Error: "+e.message,"error");}
}

async function removeParticipant(username) {
  if(!confirm(`Remove ${username}?`))return;
  try {
    const r=await readFile("users.json");
    delete r.content[username];
    await saveUsers(r.content,r.sha);
    toast("Removed");renderSettings();
  } catch(e){toast("Error: "+e.message,"error");}
}

  try {
    const {content:events}=await loadEvents();
    const eventsWithTasks=await Promise.all(events.filter(e=>e.status!=="cancelled").map(async ev=>{
      const tasks=await loadTasks(ev.id);
      const total=tasks.length,done=tasks.filter(t=>t.status==="done").length;
      const blocked=tasks.filter(t=>t.status==="blocked").length;
      const pct=total?Math.round(done/total*100):0;
      const rag=blocked>0?"red":pct===100?"green":pct>50?"amber":"amber";
      return{...ev,total,done,blocked,pct,rag};
    }));
    el.innerHTML=`
      <div class="page-header"><div><h1>Event Portfolio</h1><p class="sub">All P&amp;C events · Health at a glance</p></div></div>
      ${eventsWithTasks.length?`<div class="event-grid">${eventsWithTasks.map(ev=>`
        <div class="event-card rag-${ev.rag}" onclick="navigate('leader/event/${ev.id}')" style="cursor:pointer">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
            <div class="ec-name">${esc(ev.name)}</div>

async function renderParticipantTasks() {
  const el=document.getElementById("partMain");
  el.innerHTML=`<div style="text-align:center;padding:40px;color:#788fa5">Loading your tasks…</div>`;
  try {
    const [ws,tasks]=await Promise.all([loadWS(S.eventId),loadTasks(S.eventId)]);
    await loadEvents();
    const ev=(S.events||[]).find(e=>String(e.id)===String(S.eventId))||{};
    const me=S.user.iNum.toUpperCase();
    const myName=(S.user.name||"").toLowerCase();
    const myTasks=tasks.filter(t=>{
      const o=(t.owner||"").toLowerCase();
      return o===me.toLowerCase()||o===myName||o.includes(me.toLowerCase())||o.includes(myName);
    });
    const seeAll=ev.participants_see_all;
    el.innerHTML=`
      <div class="page-header">
        <div><h1>My Tasks</h1><p class="sub">${esc(ev.name)}</p></div>
        <button class="btn btn-ghost btn-sm" onclick="navigate('participant/dashboard')">← All Events</button>
      </div>
      ${myTasks.length?`
        ${["in_progress","blocked","pending","done"].map(status=>{
          const st=myTasks.filter(t=>t.status===status);
          if(!st.length)return"";
          const labels={in_progress:"In Progress",blocked:"Blocked",pending:"Pending",done:"Done"};
          return`<div style="margin-bottom:20px">
            <div style="font-size:11px;font-weight:700;color:#556b82;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">${labels[status]} (${st.length})</div>
            ${st.map(t=>`<div id="ptc-${t.id}" style="background:#fff;border:1px solid #e0e7ef;border-radius:8px;padding:14px 16px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start">
              <div>
                <div style="font-size:14px;font-weight:600;color:#1d2d3e">${esc(t.name)}</div>
                <div style="font-size:11px;color:#788fa5">${esc((ws.find(w=>String(w.id)===String(t.ws_id))||{}).name||"")}</div>
                ${t.due_date?`<div style="font-size:11px;color:#788fa5">Due ${esc(t.due_date)}</div>`:""}
              </div>
              <select style="padding:5px 8px;border:1px solid #c5d0de;border-radius:4px;font-size:12px" onchange="participantUpdateStatus(${t.id},this.value)">
                ${["pending","in_progress","blocked","done"].map(s=>`<option value="${s}"${t.status===s?" selected":""}>${s.replace("_"," ")}</option>`).join("")}
              </select>
            </div>`).join("")}
          </div>`;
        }).join("")}`:`<div class="empty"><div class="empty-icon">✅</div><p>No tasks assigned to you for this event.<br><span style="font-size:12px">Check back later or contact the PM.</span></p></div>`}
      ${seeAll&&tasks.length?`<div style="margin-top:32px;border-top:2px solid #e0e7ef;padding-top:24px">
        <div style="font-size:15px;font-weight:700;color:#1d2d3e;margin-bottom:4px">All Workstream Tasks</div>
        <div style="font-size:12px;color:#788fa5;margin-bottom:16px">Shared view enabled by the PM.</div>
        ${ws.map(w=>{const wt=tasks.filter(t=>String(t.ws_id)===String(w.id));return wt.length?`<div style="margin-bottom:16px">
          <div style="font-size:12px;font-weight:700;color:#556b82;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">${esc(w.name)}</div>
          ${wt.map(t=>`<div style="display:flex;gap:12px;align-items:center;padding:8px 12px;background:#f8fafc;border-radius:6px;margin-bottom:4px;font-size:13px">
            <span style="flex:1">${esc(t.name)}</span>
            <span style="min-width:110px;color:#556b82;font-size:12px">${esc(t.owner||"— unassigned")}</span>

          </div>`).join("")}
        </div>`:""}).join("")}
      </div>`:""}`;
  } catch(e){el.innerHTML=`<div class="empty"><p style="color:#e53e3e">Error: ${esc(e.message)}</p></div>`;}
}

async function participantUpdateStatus(tid,status) {
  try {
    const tasks=await loadTasks(S.eventId);
    const t=tasks.find(t=>String(t.id)===String(tid));
    if(t){t.status=status;await saveTasks(S.eventId,tasks);toast("Task updated");}
  } catch(e){toast("Save failed: "+e.message,"error");}
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function tryRestoreSession() {
  const tok=sessionStorage.getItem("pc_token");
  if(!tok)return false;
  S.token=tok;
  for(const role of["pm","leader","participant"]){
    const raw=localStorage.getItem(`pc_${role}_session`);
    if(raw){
      try {
        const {username,name}=JSON.parse(raw);
        S.user={username,name,role};
        return true;
      } catch{}
    }
  }
  return false;
}

async function init() {
  const restored=await tryRestoreSession();
  if(restored){
    enterShell();
  } else {
    showSetup();
  }
}

// Expose edit event route
window.navigate=navigate;
document.addEventListener("DOMContentLoaded",init);
</script>
