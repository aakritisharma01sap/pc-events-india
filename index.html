<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>P&C Event Orchestration Platform | SAP India</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:"72","72full",Arial,Helvetica,sans-serif;font-size:14px;color:#32363A;background:#F5F6F7;}
a{color:#0070F2;text-decoration:none;}button{cursor:pointer;font-family:inherit;}input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:#F5F6F7;}::-webkit-scrollbar-thumb{background:#C5C8CA;border-radius:3px;}
#app{display:flex;height:100vh;overflow:hidden;}
/* SIDEBAR */
#sidebar{width:220px;min-width:220px;background:#fff;border-right:1px solid #E5E7EB;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.sb-brand{padding:14px 15px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:10px;}
.sb-brand img{height:24px;}.sb-brand-txt{font-size:11.5px;font-weight:700;color:#32363A;line-height:1.3;}.sb-brand-sub{font-size:10px;color:#6A6D70;}
.nav-grp{padding:7px 0 1px;}.nav-grp-lbl{font-size:10px;font-weight:700;color:#A9ACB0;letter-spacing:.8px;text-transform:uppercase;padding:0 15px 4px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 15px;cursor:pointer;font-size:13px;color:#32363A;position:relative;transition:background .1s;}
.nav-item:hover{background:#F8F9FA;}.nav-item.active{background:#EFF4FF;color:#0070F2;font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#0070F2;border-radius:0 2px 2px 0;}
.ni{font-size:13px;width:17px;text-align:center;flex-shrink:0;}
/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#topbar{background:#fff;border-bottom:1px solid #E5E7EB;padding:0 22px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#tb-title{font-size:14px;font-weight:700;color:#32363A;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ev-sel-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0;}.ev-sel-lbl{font-size:12px;color:#6A6D70;white-space:nowrap;}
#event-selector{border:1px solid #D3D7DA;border-radius:4px;padding:5px 9px;font-size:13px;color:#32363A;background:#fff;min-width:185px;}
#content{flex:1;overflow-y:auto;padding:22px;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:4px;font-size:13px;font-weight:600;border:none;white-space:nowrap;cursor:pointer;transition:all .1s;}
.btn-primary{background:#0070F2;color:#fff;}.btn-primary:hover{background:#0060D0;}
.btn-ghost{background:transparent;color:#0070F2;border:1px solid #0070F2;}.btn-ghost:hover{background:#EFF4FF;}
.btn-neutral{background:#F5F6F7;color:#32363A;border:1px solid #D3D7DA;}.btn-neutral:hover{background:#EAECEE;}
.btn-danger{background:#BB0000;color:#fff;}.btn-danger:hover{background:#990000;}
.btn-success{background:#107E3E;color:#fff;}.btn-success:hover{background:#0C612F;}
.btn-sm{padding:4px 10px;font-size:12px;}.btn-xs{padding:2px 7px;font-size:11px;}
/* CARDS */
.card{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:18px;margin-bottom:14px;}
.card-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px;}
.card-title{font-size:14px;font-weight:700;color:#32363A;}.card-sub{font-size:12px;color:#6A6D70;margin-top:2px;}
.sec-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;}
.sec-title{font-size:18px;font-weight:700;color:#32363A;}.sec-sub{font-size:13px;color:#6A6D70;margin-top:3px;}
.sec-acts{display:flex;gap:8px;align-items:center;flex-shrink:0;}
/* STAT CHIPS */
.stat-chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.sc{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:12px 15px;flex:1;min-width:100px;}
.sc-val{font-size:22px;font-weight:700;line-height:1;}.sc-lbl{font-size:11px;color:#6A6D70;margin-top:3px;}
.sc.done{border-top:3px solid #107E3E;}.sc.done .sc-val{color:#107E3E;}
.sc.inprog{border-top:3px solid #E9730C;}.sc.inprog .sc-val{color:#E9730C;}
.sc.blocked{border-top:3px solid #BB0000;}.sc.blocked .sc-val{color:#BB0000;}
.sc.total{border-top:3px solid #0070F2;}.sc.total .sc-val{color:#0070F2;}
.sc.pending{border-top:3px solid #6A6D70;}.sc.pending .sc-val{color:#6A6D70;}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;}
.b-done{background:#F1FAF5;color:#107E3E;}.b-progress{background:#FEF7ED;color:#C8700B;}
.b-pending{background:#EFF4FF;color:#0070F2;}.b-blocked{background:#FEEFEF;color:#BB0000;}
.b-na{background:#F5F6F7;color:#6A6D70;}.b-ordered{background:#FFF8E1;color:#9A6700;}
.b-confirmed{background:#F1FAF5;color:#107E3E;}.b-received{background:#E8F5E9;color:#2E7D32;}
.b-high{background:#FEEFEF;color:#BB0000;}.b-medium{background:#FEF7ED;color:#C8700B;}.b-low{background:#F1FAF5;color:#107E3E;}
.b-planning{background:#EFF4FF;color:#0070F2;}.b-active{background:#F1FAF5;color:#107E3E;}
.b-completed{background:#F5F6F7;color:#6A6D70;}.b-cancelled{background:#FEEFEF;color:#BB0000;}
.b-keynote{background:#E1F4FF;color:#005EB8;}.b-working{background:#FFF8E1;color:#8B6914;}
.b-panel{background:#F3E8FF;color:#6E3DB7;}.b-networking{background:#E8F5E9;color:#2E7D32;}.b-break{background:#F5F6F7;color:#6A6D70;}
/* TABLES */
.dtable{width:100%;border-collapse:collapse;font-size:13px;}
.dtable th{background:#F8F9FA;padding:8px 11px;text-align:left;font-size:11px;font-weight:700;color:#6A6D70;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #E5E7EB;white-space:nowrap;}
.dtable td{padding:8px 11px;border-bottom:1px solid #F2F3F4;vertical-align:middle;}
.dtable tr:last-child td{border-bottom:none;}.dtable tr:hover td{background:#FAFAFA;}
.dtable td.acts{white-space:nowrap;text-align:right;}
/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.fg{display:flex;flex-direction:column;gap:4px;}.fg.full{grid-column:1/-1;}
.fg label{font-size:12px;font-weight:600;color:#32363A;}.fg label .req{color:#BB0000;margin-left:2px;}
.fc{border:1px solid #D3D7DA;border-radius:4px;padding:6px 9px;font-size:13px;color:#32363A;background:#fff;width:100%;transition:border-color .1s;}
.fc:focus{outline:none;border-color:#0070F2;box-shadow:0 0 0 2px rgba(0,112,242,.1);}.fc:disabled{background:#F5F6F7;color:#6A6D70;}textarea.fc{resize:vertical;min-height:66px;}
/* MODAL */
.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:8px;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.2);}
.modal-lg{max-width:860px;}.modal-xl{max-width:960px;}
.m-hdr{padding:16px 20px 13px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between;}
.m-title{font-size:15px;font-weight:700;}.m-close{background:none;border:none;font-size:17px;color:#6A6D70;cursor:pointer;padding:4px 8px;border-radius:4px;}
.m-close:hover{background:#F5F6F7;color:#32363A;}.m-body{padding:18px 20px;}.m-footer{padding:13px 20px;border-top:1px solid #E5E7EB;display:flex;justify-content:flex-end;gap:8px;}
/* BUDGET BAR */
.bbar-wrap{margin:4px 0 2px;}.bbar-track{height:7px;background:#E5E7EB;border-radius:4px;overflow:hidden;}
.bbar-fill{height:100%;border-radius:4px;transition:width .3s;}
.bbar-fill.safe{background:#0070F2;}.bbar-fill.warn{background:#E9730C;}.bbar-fill.over{background:#BB0000;}
.bbar-lbl{font-size:11px;color:#6A6D70;margin-top:3px;display:flex;justify-content:space-between;}
/* WORKSTREAM ACCORDION */
.ws-card{background:#fff;border:1px solid #E5E7EB;border-radius:8px;margin-bottom:10px;overflow:hidden;}
.ws-hdr{padding:11px 15px;background:#F8F9FA;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.ws-hdr:hover{background:#F0F1F2;}.ws-name{font-size:13px;font-weight:700;color:#32363A;display:flex;align-items:center;gap:8px;}
.ws-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}.ws-meta{font-size:11px;color:#6A6D70;}
.ws-chev{font-size:11px;color:#6A6D70;transition:transform .2s;margin-left:8px;}.ws-chev.open{transform:rotate(180deg);}
.ws-body{display:none;}.ws-body.open{display:block;}
/* TABS */
.tabs{display:flex;border-bottom:2px solid #E5E7EB;margin-bottom:16px;}
.tab{padding:8px 16px;font-size:13px;font-weight:600;color:#6A6D70;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .1s;}
.tab:hover{color:#0070F2;}.tab.active{color:#0070F2;border-bottom-color:#0070F2;}
/* EMPTY */
.empty{text-align:center;padding:50px 24px;color:#6A6D70;}
.empty-icon{font-size:40px;margin-bottom:10px;}.empty-title{font-size:14px;font-weight:700;color:#32363A;margin-bottom:6px;}
.empty-txt{font-size:13px;max-width:350px;margin:0 auto 16px;}
/* TOAST */
#toast-ct{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{background:#32363A;color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;max-width:290px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:tin .18s ease;}
.toast.ok{background:#107E3E;}.toast.err{background:#BB0000;}
@keyframes tin{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
/* AI CHAT */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:380px;}
.chat-msgs{flex:1;overflow-y:auto;padding:13px;background:#F8F9FA;border:1px solid #E5E7EB;border-radius:8px 8px 0 0;display:flex;flex-direction:column;gap:10px;}
.cmsg{max-width:82%;}.cmsg.user{align-self:flex-end;}.cmsg.bot{align-self:flex-start;}
.cbubble{padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.55;}
.cmsg.user .cbubble{background:#0070F2;color:#fff;border-bottom-right-radius:3px;}
.cmsg.bot .cbubble{background:#fff;border:1px solid #E5E7EB;color:#32363A;border-bottom-left-radius:3px;white-space:pre-wrap;}
.chat-bar{display:flex;gap:8px;padding:10px;background:#fff;border:1px solid #E5E7EB;border-top:none;border-radius:0 0 8px 8px;}
.chat-in{flex:1;border:1px solid #D3D7DA;border-radius:4px;padding:7px 11px;font-size:13px;resize:none;}
.chat-in:focus{outline:none;border-color:#0070F2;}
.chat-suggs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 0;}
.csugg{background:#EFF4FF;color:#0070F2;border:none;border-radius:14px;padding:4px 11px;font-size:11px;cursor:pointer;}
.csugg:hover{background:#D8E9FF;}
/* EMAIL */
.email-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.email-card{background:#fff;border:2px solid #E5E7EB;border-radius:8px;padding:13px;cursor:pointer;transition:all .1s;}
.email-card:hover{border-color:#0070F2;background:#EFF4FF;}.email-card.sel{border-color:#0070F2;background:#EFF4FF;}
.email-icon{font-size:20px;margin-bottom:6px;}.email-card-title{font-size:13px;font-weight:700;color:#32363A;}
.email-card-desc{font-size:11px;color:#6A6D70;margin-top:2px;}
.email-preview{background:#FAFAFA;border:1px solid #E5E7EB;border-radius:8px;padding:16px;font-size:13px;line-height:1.7;white-space:pre-wrap;font-family:inherit;color:#32363A;min-height:200px;}
/* LINKS */
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
.link-card{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:12px 14px;transition:border-color .1s;}
.link-card:hover{border-color:#0070F2;}.link-title{font-size:13px;font-weight:700;color:#32363A;margin-bottom:3px;}
.link-url{font-size:11px;color:#0070F2;word-break:break-all;margin-bottom:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
.link-meta{font-size:11px;color:#6A6D70;display:flex;gap:6px;align-items:center;}
.link-notes{font-size:11px;color:#6A6D70;margin-top:4px;}
/* MISC */
.divider{border:none;border-top:1px solid #E5E7EB;margin:14px 0;}
.alert{padding:10px 13px;border-radius:6px;font-size:13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:7px;}
.alert-info{background:#EFF4FF;border:1px solid #A3C4F5;color:#003B8E;}.alert-warn{background:#FEF7ED;border:1px solid #F5C67A;color:#7A4A00;}
.alert-ok{background:#F1FAF5;border:1px solid #8BC8A3;color:#0A4E24;}.alert-err{background:#FEEFEF;border:1px solid #F5AAAA;color:#7A0000;}
.no-ev{background:#EFF4FF;border:1px solid #A3C4F5;border-radius:8px;padding:18px;text-align:center;margin-bottom:18px;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ev-card{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:15px;cursor:pointer;transition:all .1s;}
.ev-card:hover{border-color:#0070F2;box-shadow:0 2px 8px rgba(0,112,242,.08);}
.ev-card-name{font-size:14px;font-weight:700;color:#32363A;margin-bottom:5px;}
.ev-card-meta{font-size:12px;color:#6A6D70;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
@media(max-width:768px){#sidebar{display:none;}.form-grid,.form-grid-3,.dash-grid,.email-grid{grid-template-columns:1fr;}}

/* MULTI-VENUE & MULTI-DAY */
.venue-chip{display:inline-flex;align-items:center;gap:5px;background:#E1F4FF;color:#005EB8;border-radius:5px;padding:4px 9px;font-size:12px;font-weight:600;margin:3px;}
.venue-chip .vc-rm{background:none;border:none;color:#005EB8;cursor:pointer;font-size:12px;padding:0 2px;line-height:1;}
.venues-add-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end;margin-top:8px;}
.day-cfg-row{display:grid;grid-template-columns:110px 1fr 90px 90px 90px 1fr;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;background:#F8F9FA;margin-bottom:5px;font-size:12px;}
.day-cfg-row:nth-child(odd){background:#fff;border:1px solid #F2F3F4;}
.day-lbl{font-weight:700;color:#32363A;}
.track-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;background:#F3E8FF;color:#6E3DB7;}
.agenda-day-hdr{background:linear-gradient(90deg,#0070F2 0,#4CB1FF 100%);color:#fff;border-radius:8px 8px 0 0;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
.agenda-day-hdr h3{font-size:14px;font-weight:700;margin:0;}
.agenda-day-hdr .day-meta{font-size:12px;opacity:.85;}
.time-cell{white-space:nowrap;font-size:12px;font-weight:700;color:#32363A;}
.dur-cell{font-size:11px;color:#A9ACB0;white-space:nowrap;}
.parallel-row td{background:#FFF8E1 !important;}
.parallel-row td:first-child{border-left:3px solid #E9730C;}
.section-sep{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#A9ACB0;padding:12px 0 5px;border-bottom:1px solid #E5E7EB;margin-bottom:8px;}
.day-tab-strip{display:flex;gap:0;border-bottom:2px solid #E5E7EB;margin-bottom:16px;overflow-x:auto;}
.day-tab{padding:9px 16px;font-size:13px;font-weight:600;color:#6A6D70;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .1s;display:flex;align-items:center;gap:6px;}
.day-tab:hover{color:#0070F2;background:#F8F9FA;}.day-tab.active{color:#0070F2;border-bottom-color:#0070F2;background:#EFF4FF;}
.day-tab .tab-badge{background:#E5E7EB;color:#6A6D70;border-radius:10px;padding:1px 7px;font-size:10px;}
.day-tab.active .tab-badge{background:#0070F2;color:#fff;}
.session-row{cursor:pointer;}.session-row:hover td{background:#F0F6FF !important;}
.event-form-tabs{display:flex;border-bottom:2px solid #E5E7EB;margin:-18px -20px 16px;}
.eft{padding:9px 18px;font-size:13px;font-weight:600;color:#6A6D70;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .1s;}
.eft:hover{color:#0070F2;}.eft.active{color:#0070F2;border-bottom-color:#0070F2;}
.eft-panel{display:none;}.eft-panel.active{display:block;}
</style>
</head>
<body>
<div id="app">
<!-- SIDEBAR -->

/* =====================================================================
   TASK & BUDGET STATS
   ===================================================================== */
function taskStats(ev){
 if(!ev||!ev.workstreams)return{done:0,ip:0,bl:0,pend:0,na:0,total:0};
 var done=0,ip=0,bl=0,pend=0,na=0;
 ev.workstreams.forEach(function(ws){(ws.tasks||[]).forEach(function(t){
  if(t.status==='Done')done++;else if(t.status==='In Progress')ip++;
  else if(t.status==='Blocked')bl++;else if(t.status==='N/A')na++;else pend++;
 });});
 return{done:done,ip:ip,bl:bl,pend:pend,na:na,total:done+ip+bl+pend+na};
}
function budgetStats(ev){
 if(!ev)return{total:0,est:0,act:0};
 var est=(ev.budgetLines||[]).reduce(function(a,l){return a+(l.est||0);},0);
 var act=(ev.budgetLines||[]).reduce(function(a,l){return a+(l.act||0);},0);
 return{total:ev.budget||est,est:est,act:act};
}
function budgetBar(used,total){
 var pct=total?Math.min(Math.round(used/total*100),110):0;
 var cls=pct>=100?'over':pct>=80?'warn':'safe';
 return'<div class="bbar-wrap"><div class="bbar-track"><div class="bbar-fill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div></div><div class="bbar-lbl"><span>'+inr(used)+' used</span><span>'+pct+'% of '+inr(total)+'</span></div></div>';
}
function progBar(done,total){
 var pct=total?Math.min(Math.round(done/total*100),100):0;
 var fill=pct>=100?'#107E3E':pct>=60?'#0070F2':'#E9730C';
 return'<div class="bbar-wrap"><div class="bbar-track"><div class="bbar-fill" style="width:'+pct+'%;height:100%;background:'+fill+';border-radius:4px;"></div></div><div class="bbar-lbl"><span>'+done+'/'+total+' tasks done</span><span>'+pct+'%</span></div></div>';
}

function fmtDate(d){if(!d)return'';var p=d.split('-');if(p.length<3)return d;var mns=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return p[2]+' '+mns[parseInt(p[1])-1];}
function getOrCreateDays(ev){
 if(!ev)return[];
 if(!ev.startDate)return ev.days||[];
 var days=ev.days||[];
 var sd=new Date(ev.startDate),ed=new Date(ev.endDate||ev.startDate);
 var needed=[];for(var d=new Date(sd);d<=ed;d.setDate(d.getDate()+1)){needed.push(d.toISOString().slice(0,10));}
 // Merge existing days with needed dates
 var result=needed.map(function(dt,i){
  var ex=days.find(function(d){return d.date===dt;});
  return ex||{id:uid(),date:dt,label:'Day '+(i+1),headcount:ev.headcount||'',startTime:ev.defaultStartTime||'09:00',endTime:ev.defaultEndTime||'18:00',venueId:''};
 });
 return result;
}

function saveEvent(existingId){
 var name=document.getElementById('ef-name').value.trim();if(!name){toast('Event name is required','err');return;}
 var campus=document.getElementById('ef-campus').value;
 var venues=window._tmpVenues||[];
 var days=window._tmpDays||[];
 // if no venues but campus selected, create one from primary campus
 if(venues.length===0&&campus&&CAMPUS[campus]){
  var def=document.getElementById('ef-venue');
  var rn=def?def.value:'';
  if(!rn&&CAMPUS[campus].rooms.length>0)rn=CAMPUS[campus].rooms[0].n;
  if(rn)venues=[{id:uid(),campus:campus,room:rn,cap:0,label:'Primary Venue'}];
 }
 var startDate=document.getElementById('ef-sd').value;
 var endDate=document.getElementById('ef-ed').value;
 // Ensure days reflect current dates (use _tmpDays if populated, else generate fresh)
 if(days.length===0&&startDate){
  var tmpEv={startDate:startDate,endDate:endDate||startDate,days:[],venues:venues,
   defaultStartTime:document.getElementById('ef-stime').value,defaultEndTime:document.getElementById('ef-etime').value,
   headcount:parseInt(document.getElementById('ef-hc').value)||0};
  days=getOrCreateDays(tmpEv);
 }
 var ev={
  id:existingId||uid(),name:name,startDate:startDate,endDate:endDate,
  defaultStartTime:document.getElementById('ef-stime').value||'09:00',
  defaultEndTime:document.getElementById('ef-etime').value||'18:00',
  campus:campus,venues:venues,days:days,
  headcount:parseInt(document.getElementById('ef-hc').value)||0,
  budget:parseInt(document.getElementById('ef-bud').value)||0,
  costCenter:document.getElementById('ef-cc').value,
  ioNumber:document.getElementById('ef-io').value,
  status:document.getElementById('ef-status').value
 };
 if(existingId){
  var idx=ST.events.findIndex(function(e){return e.id===existingId;});
  if(idx>=0){
   var kept={workstreams:ST.events[idx].workstreams,sessions:ST.events[idx].sessions,
    budgetLines:ST.events[idx].budgetLines,logisticsItems:ST.events[idx].logisticsItems,links:ST.events[idx].links};
   Object.assign(ST.events[idx],ev,kept);
  }
 } else {
  ev.workstreams=[];ev.sessions=[];ev.budgetLines=[];ev.logisticsItems=[];ev.links=[];
  ST.events.push(ev);ST.curId=ev.id;
 }
 window._tmpVenues=null;window._tmpDays=null;
 save();closeModal();popSel();renderAll();toast('Event saved','ok');
}
function deleteEvent(id){
 if(!confirm('Delete this event and all its data? This cannot be undone.'))return;
 ST.events=ST.events.filter(function(e){return e.id!==id;});
 if(ST.curId===id)ST.curId=null;
 save();popSel();renderAll();toast('Event deleted');
}

    s+='<td><input type="date" class="fc" style="padding:3px 6px;" value="'+esc(t.dueDate||'')+'" onchange="updateTask(\''+esc(ws.id)+'\','+ti+',\'dueDate\',this.value)"></td>';
    s+='<td><select class="fc" style="padding:3px 6px;" onchange="updateTask(\''+esc(ws.id)+'\','+ti+',\'priority\',this.value)">';
    ['High','Medium','Low'].forEach(function(p){s+='<option'+(t.priority===p?' selected':'')+'>'+p+'</option>';});
    s+='</select></td>';
    s+='<td><select class="fc" style="padding:3px 6px;" onchange="updateTask(\''+esc(ws.id)+'\','+ti+',\'status\',this.value)">';
    ['Pending','In Progress','Done','Blocked','N/A'].forEach(function(p){s+='<option'+(t.status===p?' selected':'')+'>'+p+'</option>';});
    s+='</select></td>';

   });

 });

/* ===== AGENDA HELPERS ===== */
function durStr(s,e){
 if(!s||!e)return'';
 var sm=parseInt(s.replace(':',''),10)*100/100,em=parseInt(e.replace(':',''),10)*100/100;
 var sh=Math.floor(sm/100),smin=sm%100,eh=Math.floor(em/100),emin=em%100;
 var totMin=(eh*60+emin)-(sh*60+smin);
 if(totMin<=0)return'';
 var h=Math.floor(totMin/60),m=totMin%60;
 return(h>0?h+'h ':'')+(m>0?m+'m':'');
}
function getEvtVenueLabel(ev,venueId,room){
 if(!ev)return room||'—';
 if(venueId){var vn=(ev.venues||[]).find(function(v){return v.id===venueId;});if(vn)return vn.campus+' – '+vn.room+(vn.label?' ('+vn.label+')':'');}
 if(room)return room;
 return'—';
}
function buildVenueOpts(ev,selId,selRoom){
 var opts='<option value="">— Select venue —</option>';
 (ev.venues||[]).forEach(function(v){
  var val=v.id;
  opts+='<option value="'+esc(val)+'"'+(selId===val?' selected':'')+'>'+esc(v.campus)+' – '+esc(v.room)+(v.label?' ('+esc(v.label)+')':'')+(v.cap?' | cap.'+v.cap:'')+'</option>';
 });
 // All rooms from all campuses as fallback
 opts+='<optgroup label="──── All Campus Rooms ────">';
 Object.keys(CAMPUS).forEach(function(c){
  CAMPUS[c].rooms.forEach(function(r){
   var val='room::'+c+'::'+r.n;
   opts+='<option value="'+esc(val)+'"'+(selRoom&&selRoom===r.n&&!selId?' selected':'')+'>'+esc(c)+' – '+esc(r.n)+' (cap.'+r.cap+')</option>';
  });
 });
 opts+='</optgroup>';
 opts+='<option value="other"'+(selRoom==='Other'&&!selId?' selected':'')+'> Other / External</option>';
 return opts;
}
function buildDayOpts(ev,selDate){
 var days=getOrCreateDays(ev);
 if(days.length===0)return'<option value="">No days configured</option>';
 return days.map(function(d){
  return'<option value="'+esc(d.date)+'"'+(selDate===d.date?' selected':'')+'>'+esc(fmtDate(d.date))+(d.label?' – '+esc(d.label):'')+'</option>';
 }).join('');
}
var _curAgendaDay=null;
function setAgendaDay(d){_curAgendaDay=d;renderAll();}
function rAgenda(){
 var ev=ce();if(!ev)return noEv();
 var sessions=ev.sessions||[];
 var days=getOrCreateDays(ev);
 var s='<div class="sec-hdr"><div><div class="sec-title">Agenda Planner</div><div class="sec-sub">'+esc(ev.name)+(days.length>1?' &nbsp;|&nbsp; '+days.length+' days':'')+'</div></div>';
 s+='<div class="sec-acts"><button class="btn btn-primary" onclick="openAddSessionModal()">＋ Add Session</button></div></div>';
 // Day tab strip
 if(days.length>0){
  if(!_curAgendaDay||!days.find(function(d){return d.date===_curAgendaDay;}))_curAgendaDay=days[0].date;
  s+='<div class="day-tab-strip">';
  s+='<div class="day-tab'+(_curAgendaDay===null?' active':'')+'" onclick="setAgendaDay(null)">All Days</div>';
  days.forEach(function(d){
   var cnt=sessions.filter(function(ss){return ss.date===d.date;}).length;
   var active=_curAgendaDay===d.date;
   s+='<div class="day-tab'+(active?' active':'')+'" onclick="setAgendaDay(\''+esc(d.date)+'\')">';
   s+=esc(fmtDate(d.date))+(d.label?' – '+esc(d.label):'')+' <span class="tab-badge">'+cnt+'</span></div>';
  });
  s+='</div>';
 }
 if(sessions.length===0)return s+'<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No sessions yet</div><div class="empty-txt">Add sessions to build your day-by-day agenda across all venues.</div><button class="btn btn-primary" onclick="openAddSessionModal()">＋ Add Session</button></div>';
 // Filter sessions by active day
 var filterDays=_curAgendaDay?[_curAgendaDay]:days.map(function(d){return d.date;});
 var datesUsed=filterDays.length>0?filterDays:['No Date'];
 // Gather all dates in sessions that match
 var allDates={};
 sessions.forEach(function(ss){var d=ss.date||'No Date';allDates[d]=true;});
 var orderedDates=[];
 datesUsed.forEach(function(d){if(allDates[d])orderedDates.push(d);});
 if(orderedDates.length===0&&_curAgendaDay===null&&Object.keys(allDates).length>0)orderedDates=Object.keys(allDates).sort();
 orderedDates.forEach(function(dt){
  var daySessions=sessions.filter(function(ss){return(ss.date||'No Date')===dt;});
  daySessions.sort(function(a,b){return(a.startTime||'').localeCompare(b.startTime||'');});
  var dayObj=days.find(function(d){return d.date===dt;})||{};
  var dayHC=dayObj.headcount||ev.headcount||'';
  var dayLabel=dayObj.label||'';
  // detect parallel (same start time)
  var timeMap={};daySessions.forEach(function(ss){var t=ss.startTime||'';timeMap[t]=(timeMap[t]||0)+1;});
  s+='<div class="agenda-day-hdr"><h3>'+esc(fmtDate(dt))+(dayLabel?' &nbsp;·&nbsp; '+esc(dayLabel):'')+'</h3>';
  s+='<div class="day-meta">'+(dayHC?'👥 '+dayHC+' attendees &nbsp;':'')+(dayObj.startTime||dayObj.endTime?(dayObj.startTime||'')+'–'+(dayObj.endTime||''):'')+'</div></div>';
  s+='<div class="card" style="padding:0;overflow:hidden;overflow-x:auto;margin-bottom:4px;border-radius:0 0 8px 8px;">';
  s+='<table class="dtable">';
  s+='<tr><th style="white-space:nowrap;">Start</th><th>End</th><th>Dur.</th><th>Track</th><th style="min-width:200px;">Session</th><th>Type</th><th>Speaker / Facilitator</th><th>Format</th><th>Venue / Room</th><th>Attendees</th><th>Notes</th><th>Materials</th><th class="acts">Actions</th></tr>';
  daySessions.forEach(function(ss){
   var si=sessions.indexOf(ss);
   var isParallel=(timeMap[ss.startTime||'']||0)>1;
   var dur=durStr(ss.startTime||'',ss.endTime||'');
   var vLabel=getEvtVenueLabel(ev,ss.venueId,ss.room);
   s+='<tr class="session-row'+(isParallel?' parallel-row':'')+'">';
   s+='<td class="time-cell">'+esc(ss.startTime||'—')+'</td>';
   s+='<td class="time-cell" style="color:#6A6D70;">'+esc(ss.endTime||'—')+'</td>';
   s+='<td class="dur-cell">'+esc(dur)+'</td>';
   s+='<td>'+(ss.track?'<span class="track-badge">'+esc(ss.track)+'</span>':'')+'</td>';
   s+='<td style="min-width:200px;"><b style="font-size:13px;">'+esc(ss.title||'')+'</b>'+(ss.notes?'<div style="font-size:11px;color:#6A6D70;margin-top:2px;overflow:hidden;max-width:240px;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(ss.notes)+'">'+esc(ss.notes)+'</div>':'')+'</td>';
   s+='<td>'+stBadge(ss.type||'')+'</td>';
   s+='<td style="font-size:12px;min-width:120px;">'+esc(ss.speaker||'—')+'</td>';
   s+='<td style="font-size:12px;white-space:nowrap;">'+esc(ss.format||'—')+'</td>';
   s+='<td style="font-size:12px;min-width:130px;">'+esc(vLabel)+'</td>';
   s+='<td style="font-size:12px;white-space:nowrap;">'+(ss.headcount?esc(ss.headcount):'—')+'</td>';
   s+='<td style="font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(ss.notes||'')+'"></td>';
   s+='<td>'+(ss.materialsLink?'<a href="'+esc(ss.materialsLink)+'" target="_blank" style="font-size:11px;color:#0070F2;">Link ↗</a>':'')+'</td>';
   s+='<td class="acts" style="white-space:nowrap;"><button class="btn btn-ghost btn-xs" onclick="openEditSessionModal('+si+')">Edit</button> <button class="btn btn-danger btn-xs" onclick="deleteSession('+si+')">&#x2715;</button></td>';
   s+='</tr>';
  });
  s+='</table></div>';
 });
 if(orderedDates.length===0)s+='<div class="alert alert-info" style="margin-top:8px;">No sessions on this day yet. <a href="#" onclick="openAddSessionModal();return false;">Add a session</a></div>';
 return s;
}
/* ===== SESSION MODAL ===== */
function sessionModal(idx,presetDate){
 var ev=ce();if(!ev)return;
 var ss=idx!==null&&idx!==undefined?ev.sessions[idx]:{};var v=ss||{};
 var defDate=presetDate||v.date||(ev.startDate||'');
 var vOpts=buildVenueOpts(ev,v.venueId||'',v.room||'');
 var dOpts=buildDayOpts(ev,defDate);
 var formats=['Live','Recorded','Hybrid','Virtual','Live + Recorded'];
 var fmtSel=formats.map(function(f){return'<option value="'+f+'"'+(v.format===f?' selected':'')+'>'+f+'</option>';}).join('');
 showModal('<div class="modal modal-xl"><div class="m-hdr"><div class="m-title">'+(idx!==null&&idx!==undefined?'Edit':'Add')+' Session</div><button class="m-close" onclick="closeModal()">&#x2715;</button></div>'+
  '<div class="m-body"><div class="form-grid">'+
  '<div class="fg full"><label>Session Title <span class="req">*</span></label><input class="fc" id="ss-title" value="'+esc(v.title||'')+'" placeholder="e.g. Opening Keynote – Gina Vargiu"></div>'+
  '<div class="fg"><label>Day</label><select class="fc" id="ss-date">'+dOpts+'</select></div>'+
  '<div class="fg"><label>Session Type</label><select class="fc" id="ss-type"><option>Keynote</option><option>Working Session</option><option>Panel</option><option>Networking</option><option>Break</option></select></div>'+
  '<div class="fg"><label>Start Time</label><input type="time" class="fc" id="ss-st" value="'+esc(v.startTime||'')+'" step="300" onchange="calcDur()"></div>'+
  '<div class="fg"><label>End Time</label><input type="time" class="fc" id="ss-et" value="'+esc(v.endTime||'')+'" step="300" onchange="calcDur()"></div>'+
  '<div class="fg"><label>Duration</label><input class="fc" id="ss-dur" value="'+esc(durStr(v.startTime||'',v.endTime||''))+'" placeholder="Auto-calculated" readonly style="background:#F8F9FA;"></div>'+
  '<div class="fg"><label>Track / Parallel Session</label><input class="fc" id="ss-track" value="'+esc(v.track||'')+'" placeholder="e.g. Main / Track A / Track B"></div>'+
  '<div class="fg"><label>Format</label><select class="fc" id="ss-fmt">'+fmtSel+'<option value="" '+(v.format?'':'selected')+'>Custom...</option></select></div>'+
  '<div class="fg full"><label>Venue / Room</label><select class="fc" id="ss-venue">'+vOpts+'</select></div>'+
  '<div class="fg"><label>Expected Attendees (this session)</label><input type="number" class="fc" id="ss-hc" value="'+esc(v.headcount||'')+'" placeholder="e.g. 100"></div>'+
  '<div class="fg"><label>Speaker / Facilitator(s)</label><input class="fc" id="ss-spk" value="'+esc(v.speaker||'')+'" placeholder="Name(s), role"></div>'+
  '<div class="fg full"><label>Notes / Run-of-Show / Discussion Prompts</label><textarea class="fc" id="ss-notes" rows="3" placeholder="Menti links, Q&A prompts, run-of-show notes, instructions for facilitators...">'+esc(v.notes||'')+'</textarea></div>'+
  '<div class="fg full"><label>Materials Link</label><input class="fc" id="ss-ml" value="'+esc(v.materialsLink||'')+'" placeholder="SharePoint / Teams link to deck, slides, or pre-read"></div>'+
  '</div></div>'+
  '<div class="m-footer"><button class="btn btn-neutral" onclick="closeModal()">Cancel</button>'+
  (idx!==null&&idx!==undefined?'<button class="btn btn-danger" onclick="deleteSession('+idx+');closeModal();">Delete</button>':'')+
  '<button class="btn btn-primary" onclick="saveSession('+(idx!==null&&idx!==undefined?idx:'null')+')">Save Session</button></div></div>');
 if(v.type){var el=document.getElementById('ss-type');if(el)el.value=v.type;}
}
function calcDur(){
 var st=document.getElementById('ss-st'),et=document.getElementById('ss-et'),dur=document.getElementById('ss-dur');
 if(st&&et&&dur)dur.value=durStr(st.value,et.value)||'';
}
function openAddSessionModal(presetDate){sessionModal(null,presetDate);}
function openEditSessionModal(i){sessionModal(i);}
function saveSession(idx){
 var title=document.getElementById('ss-title').value.trim();if(!title){toast('Session title required','err');return;}
 var ev=ce();if(!ev)return;
 if(!ev.sessions)ev.sessions=[];
 var venueVal=document.getElementById('ss-venue').value;
 var venueId='',room='';
 if(venueVal&&venueVal!=='other'){
  if(venueVal.startsWith('room::')){var rp=venueVal.split('::');room=rp[2]||'';}
  else venueId=venueVal;
 } else if(venueVal==='other'){room='Other';}
 var ss={title:title,date:document.getElementById('ss-date').value,
  type:document.getElementById('ss-type').value,
  startTime:document.getElementById('ss-st').value,
  endTime:document.getElementById('ss-et').value,
  track:document.getElementById('ss-track').value,
  format:document.getElementById('ss-fmt').value,
  venueId:venueId,room:room,
  headcount:parseInt(document.getElementById('ss-hc').value)||0,
  speaker:document.getElementById('ss-spk').value,
  notes:document.getElementById('ss-notes').value,
  materialsLink:document.getElementById('ss-ml').value};
 if(idx!==null&&idx!==undefined&&idx!=='null')ev.sessions[idx]=ss;else ev.sessions.push(ss);
 save();closeModal();renderAll();toast('Session saved','ok');
}
function deleteSession(i){
 if(!confirm('Delete this session?'))return;
 var ev=ce();if(!ev)return;
 ev.sessions.splice(i,1);save();renderAll();toast('Session deleted');
}

/* =====================================================================
   BUDGET TRACKER
   ===================================================================== */
function rBudget(){
 var ev=ce();if(!ev)return noEv();
 var lines=ev.budgetLines||[];
 var bs=budgetStats(ev);
 var s='<div class="sec-hdr"><div><div class="sec-title">Budget Tracker</div><div class="sec-sub">'+esc(ev.name)+'</div></div>';
 s+='<div class="sec-acts">';
 if(lines.length===0)s+='<button class="btn btn-success" onclick="loadBudgetTemplate()">&#9881; Load Template (14 lines)</button>';
 s+='<button class="btn btn-primary" onclick="openAddBudgetModal()">＋ Add Line</button>';
 s+='</div></div>';
 // summary
 var pct=bs.total?(bs.act/bs.total)*100:0;var cls=pct>=100?'over':pct>=80?'warn':'safe';
 s+='<div class="card"><div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px;">';
 s+='<div><div style="font-size:11px;color:#6A6D70;margin-bottom:2px;">Total Budget</div><div style="font-size:20px;font-weight:700;">'+inr(bs.total||bs.est)+'</div></div>';
 s+='<div><div style="font-size:11px;color:#6A6D70;margin-bottom:2px;">Total Estimated</div><div style="font-size:20px;font-weight:700;color:#E9730C;">'+inr(bs.est)+'</div></div>';
 s+='<div><div style="font-size:11px;color:#6A6D70;margin-bottom:2px;">Actual Spend</div><div style="font-size:20px;font-weight:700;color:'+(bs.act>(bs.total||bs.est)?'#BB0000':'#107E3E')+'">'+inr(bs.act)+'</div></div>';
 s+='<div><div style="font-size:11px;color:#6A6D70;margin-bottom:2px;">Remaining</div><div style="font-size:20px;font-weight:700;">'+inr((bs.total||bs.est)-bs.act)+'</div></div>';
 s+='</div>';
 s+='<div class="bbar-track" style="height:12px;"><div class="bbar-fill '+cls+'" style="width:'+Math.min(pct,100)+'%;height:100%;border-radius:4px;"></div></div>';
 s+='<div class="bbar-lbl"><span>'+Math.round(pct)+'% of total budget used</span><span>'+(pct>=100?'<b style="color:#BB0000;">OVER BUDGET</b>':inr((bs.total||bs.est)-bs.act)+' remaining')+'</span></div>';
 s+='</div>';
 if(lines.length===0)return s+'<div class="empty"><div class="empty-icon">₹</div><div class="empty-title">No budget lines yet</div><div class="empty-txt">Load the standard template to get 14 pre-built budget lines, or add lines manually.</div><button class="btn btn-success" onclick="loadBudgetTemplate()">&#9881; Load Budget Template</button></div>';
 s+='<div class="card" style="padding:0;overflow:hidden;overflow-x:auto;"><table class="dtable">';
 s+='<tr><th>#</th><th>Description</th><th>Category</th><th>Workstream</th><th>Vendor</th><th>Estimated (₹)</th><th>Actual (₹)</th><th>Var.</th><th>Cost Center</th><th>IO / WBS</th><th class="acts">Actions</th></tr>';
 lines.forEach(function(l,i){
  var diff=(l.act||0)-(l.est||0);
  s+='<tr>';
  s+='<td style="color:#6A6D70;font-size:11px;">'+(i+1)+'</td>';
  s+='<td style="min-width:200px;font-size:13px;">'+esc(l.desc)+'</td>';
  s+='<td><span style="background:#E1F4FF;color:#005EB8;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;">'+esc(l.cat||'—')+'</span></td>';
  s+='<td style="font-size:12px;">'+esc(l.ws||'—')+'</td>';
  s+='<td style="font-size:12px;">'+esc(l.vendor||'—')+'</td>';
  s+='<td><input type="number" class="fc" style="padding:3px 6px;min-width:100px;" value="'+esc(l.est||0)+'" onchange="updateBLine('+i+',\'est\',this.value)"></td>';
  s+='<td><input type="number" class="fc" style="padding:3px 6px;min-width:100px;" value="'+esc(l.act||0)+'" onchange="updateBLine('+i+',\'act\',this.value)"></td>';
  s+='<td style="font-size:12px;color:'+(diff>0?'#BB0000':diff<0?'#107E3E':'#6A6D70')+';font-weight:600;">'+(diff>0?'+':'')+inr(diff)+'</td>';
  s+='<td><input class="fc" style="padding:3px 6px;min-width:100px;" value="'+esc(l.cc||'')+'" onchange="updateBLine('+i+',\'cc\',this.value)" placeholder="Cost Center"></td>';
  s+='<td><input class="fc" style="padding:3px 6px;min-width:80px;" value="'+esc(l.io||'')+'" onchange="updateBLine('+i+',\'io\',this.value)" placeholder="IO/WBS"></td>';
  s+='<td class="acts"><button class="btn btn-danger btn-xs" onclick="deleteBLine('+i+')">&#x2715;</button></td>';
  s+='</tr>';
 });
 // totals row
 var totEst=lines.reduce(function(a,l){return a+(l.est||0);},0);
 var totAct=lines.reduce(function(a,l){return a+(l.act||0);},0);
 var totDiff=totAct-totEst;
 s+='<tr style="background:#F8F9FA;font-weight:700;">';
 s+='<td colspan="5" style="text-align:right;font-size:12px;color:#6A6D70;">TOTALS</td>';
 s+='<td style="font-size:13px;">'+inr(totEst)+'</td><td style="font-size:13px;">'+inr(totAct)+'</td>';
 s+='<td style="font-size:12px;color:'+(totDiff>0?'#BB0000':'#107E3E')+'">'+(totDiff>0?'+':'')+inr(totDiff)+'</td>';
 s+='<td colspan="3"></td></tr>';
 s+='</table></div>';
 return s;
}
function loadBudgetTemplate(){
 var ev=ce();if(!ev)return;
 if(ev.budgetLines&&ev.budgetLines.length>0&&!confirm('Replace existing budget lines?'))return;
 ev.budgetLines=BUDGET_TPL.map(function(l){return Object.assign({id:uid()},l);});
 // auto-populate last line (contingency) as 5% of others
 var subtotal=ev.budgetLines.slice(0,-1).reduce(function(a,l){return a+(l.est||0);},0);
 ev.budgetLines[ev.budgetLines.length-1].est=Math.round(subtotal*0.05);
 save();renderAll();toast('Budget template loaded – 14 lines','ok');
}
function openAddBudgetModal(){
 showModal('<div class="modal modal-lg"><div class="m-hdr"><div class="m-title">Add Budget Line</div><button class="m-close" onclick="closeModal()">&#x2715;</button></div><div class="m-body"><div class="form-grid">'+
  '<div class="fg full"><label>Description <span class="req">*</span></label><input class="fc" id="bl-desc" placeholder="e.g. Catering – Lunch for All Attendees"></div>'+
  '<div class="fg"><label>Category</label><select class="fc" id="bl-cat"><option>Venue</option><option>Catering</option><option>IT & AV</option><option>Printing</option><option>Stationery</option><option>Branding</option><option>Photography</option><option>Travel</option><option>Merchandise</option><option>Miscellaneous</option></select></div>'+
  '<div class="fg"><label>Workstream</label><input class="fc" id="bl-ws" placeholder="e.g. Venue & GRF"></div>'+
  '<div class="fg"><label>Vendor</label><input class="fc" id="bl-vendor" placeholder="e.g. Campus Cafeteria"></div>'+
  '<div class="fg"><label>Estimated Amount (₹)</label><input type="number" class="fc" id="bl-est" placeholder="0"></div>'+
  '<div class="fg"><label>Actual Amount (₹)</label><input type="number" class="fc" id="bl-act" placeholder="0"></div>'+
  '<div class="fg"><label>Cost Center</label><input class="fc" id="bl-cc" placeholder="e.g. 171000039"></div>'+
  '<div class="fg"><label>IO / WBS</label><input class="fc" id="bl-io" placeholder="e.g. 333968"></div>'+
  '</div></div><div class="m-footer"><button class="btn btn-neutral" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveBLine()">Add Line</button></div></div>');
}
function saveBLine(){
 var desc=document.getElementById('bl-desc').value.trim();if(!desc){toast('Description required','err');return;}
 var ev=ce();if(!ev)return;
 if(!ev.budgetLines)ev.budgetLines=[];
 ev.budgetLines.push({id:uid(),desc:desc,cat:document.getElementById('bl-cat').value,ws:document.getElementById('bl-ws').value,vendor:document.getElementById('bl-vendor').value,est:parseInt(document.getElementById('bl-est').value)||0,act:parseInt(document.getElementById('bl-act').value)||0,cc:document.getElementById('bl-cc').value,io:document.getElementById('bl-io').value});
 save();closeModal();renderAll();toast('Budget line added','ok');
}
function updateBLine(i,field,val){
 var ev=ce();if(!ev||!ev.budgetLines[i])return;
 ev.budgetLines[i][field]=(field==='est'||field==='act')?parseInt(val)||0:val;
 save();
 // re-render budget summary without full refresh
 setTimeout(function(){
  var bs=budgetStats(ev);
  var pct=bs.total?(bs.act/bs.total)*100:0;
  var cls=pct>=100?'over':pct>=80?'warn':'safe';
  document.querySelectorAll('.bbar-fill').forEach(function(el){el.className='bbar-fill '+cls;el.style.width=Math.min(pct,100)+'%';});
 },0);
}
function deleteBLine(i){
 var ev=ce();if(!ev)return;ev.budgetLines.splice(i,1);save();renderAll();toast('Budget line deleted');
}
/* =====================================================================
   LOGISTICS TRACKER
   ===================================================================== */
function rLog(){
 var ev=ce();if(!ev)return noEv();
 var items=ev.logisticsItems||[];
 var s='<div class="sec-hdr"><div><div class="sec-title">Logistics Tracker</div><div class="sec-sub">'+esc(ev.name)+'</div></div>';
 s+='<div class="sec-acts">';
 if(items.length===0)s+='<button class="btn btn-success" onclick="loadLogTemplate()">&#9881; Load Template (23 items)</button>';
 s+='<button class="btn btn-primary" onclick="openAddLogModal()">＋ Add Item</button>';
 s+='</div></div>';
 // summary chips
 var byStatus={Pending:0,Ordered:0,Confirmed:0,Received:0};
 items.forEach(function(i){byStatus[i.status]=(byStatus[i.status]||0)+1;});
 s+='<div class="stat-chips">';

  s+='<div class="cmsg bot"><div class="cbubble">Hello! I am your P&C Event AI Assistant. I can help you with task status, budget analysis, risk identification, and drafting communications.\n\nTo get started, select an event from the top bar and ask me anything about your event planning progress.</div></div>';

function sendChat(preset){
 var inp=document.getElementById('chat-in');
 var msg=preset||(inp?inp.value.trim():'');
 if(!msg)return;
 if(inp)inp.value='';
 chatHistory.push({role:'user',text:msg});
 var reply=aiReply(msg);
 chatHistory.push({role:'bot',text:reply});
 renderAll();
 setTimeout(function(){
  var el=document.getElementById('chat-msgs');
  if(el)el.scrollTop=el.scrollHeight;
 },50);
}
function aiReply(msg){
 var ev=ce();
 var q=msg.toLowerCase();
 if(!ev)return'No event is currently selected. Please select or create an event from the top bar and then ask your question.';
 var ts=taskStats(ev);var bs=budgetStats(ev);
 var pct=ts.total?Math.round(ts.done/ts.total*100):0;
 // task status
 if(q.indexOf('task')>=0&&(q.indexOf('status')>=0||q.indexOf('completion')>=0||q.indexOf('progress')>=0)){
  var reply='Task Tracker Summary – '+ev.name+'\n\n';
  reply+='Overall Completion: '+ts.done+'/'+ts.total+' tasks ('+pct+'%)\n';
  reply+='• Done: '+ts.done+'\n• In Progress: '+ts.ip+'\n• Pending: '+ts.pend+'\n• Blocked: '+ts.bl+'\n• N/A: '+ts.na+'\n\n';
  reply+='Workstream Breakdown:\n';
  (ev.workstreams||[]).forEach(function(ws){
   var wd=0,wt=0;(ws.tasks||[]).forEach(function(t){wt++;if(t.status==='Done')wd++;});
   var wp=wt?Math.round(wd/wt*100):0;
   var bl=(ws.tasks||[]).filter(function(t){return t.status==='Blocked';}).length;
   reply+='  '+ws.name+': '+wd+'/'+wt+' ('+wp+'%)'+(bl>0?' ⚠ '+bl+' BLOCKED':'')+'\n';
  });
  if(ts.bl>0){reply+='\nBlocked Tasks:\n';(ev.workstreams||[]).forEach(function(ws){(ws.tasks||[]).forEach(function(t){if(t.status==='Blocked')reply+='  • ['+ws.name+'] '+t.name+(t.owner?' ('+t.owner+')':'')+'\n';});});}
  return reply;
 }
 // blocked
 if(q.indexOf('block')>=0){
  if(ts.bl===0)return'No blocked tasks found in '+ev.name+'. All tasks are either done, in progress, or pending.\n\nKeep monitoring – blocked items tend to emerge closer to the event date.';
  var reply='Blocked Tasks in '+ev.name+':\n\n';
  (ev.workstreams||[]).forEach(function(ws){(ws.tasks||[]).forEach(function(t){if(t.status==='Blocked')reply+='⛔ ['+ws.name+']\n  Task: '+t.name+'\n  Owner: '+(t.owner||'Unassigned')+'\n  Comments: '+(t.comments||'No comments')+'\n\n';});});
  reply+='Recommendation: Review each blocked task with the relevant owner, identify the blocker, and either escalate or re-prioritise.';
  return reply;
 }
 // budget
 if(q.indexOf('budget')>=0){
  var budPct=bs.total?(bs.act/bs.total*100):0;
  var reply='Budget Health – '+ev.name+'\n\n';
  reply+='Total Budget: '+inr(bs.total||bs.est)+'\n';
  reply+='Total Estimated: '+inr(bs.est)+'\n';
  reply+='Actual Spend to Date: '+inr(bs.act)+'\n';
  reply+='Utilisation: '+Math.round(budPct)+'%\n\n';
  if(bs.act>=(bs.total||bs.est))reply+='⚠ ALERT: Budget is at or over limit. Immediate review required before committing further spend.\n';
  else if(budPct>=80)reply+='⚠ Caution: Budget is >80% utilised. Review remaining commitments carefully.\n';
  else reply+='✓ Budget is within healthy limits.\n';
  if(bs.est>(bs.total||0)&&bs.total>0)reply+='\nNote: Estimated spend ('+inr(bs.est)+') exceeds the total budget ('+inr(bs.total)+'). Consider reviewing estimates or requesting additional budget.\n';
  var zeroAct=(ev.budgetLines||[]).filter(function(l){return l.est>0&&l.act===0;});
  if(zeroAct.length>0)reply+='\nLine items with spend not yet recorded ('+zeroAct.length+'):\n'+zeroAct.slice(0,5).map(function(l){return'  • '+l.desc+' (Est: '+inr(l.est)+')';}).join('\n');
  return reply;
 }
 // status update
 if((q.indexOf('status update')>=0||q.indexOf('draft')>=0||q.indexOf('leadership')>=0)){
  var budPct=bs.total?(bs.act/bs.total*100):0;
  return'Status Update – '+ev.name+'\n(Draft for leadership communication)\n\n---\n\nHello,\n\nPlease find below a brief status update on the '+ev.name+'.\n\n**Event Overview:**\n• Event: '+ev.name+'\n• Date(s): '+(ev.startDate||'TBD')+(ev.endDate&&ev.endDate!==ev.startDate?' – '+ev.endDate:'')+'\n• Campus: '+(ev.campus||'TBD')+' | Venue: '+(ev.venue||'TBD')+'\n• Expected Headcount: '+(ev.headcount||'TBD')+'\n\n**Planning Progress:**\n• Tasks: '+ts.done+'/'+ts.total+' completed ('+pct+'%)\n• In Progress: '+ts.ip+' tasks\n• Blocked: '+ts.bl+(ts.bl>0?' – requires attention':' (no blockers)')+'\n\n**Budget:**\n• Budget: '+inr(bs.total||bs.est)+' | Estimated: '+inr(bs.est)+' | Actual: '+inr(bs.act)+'\n• Utilisation: '+Math.round(budPct)+'%'+(budPct>=80?' ⚠ Monitor closely':'')+'\n\n**Key Milestones This Week:**\n[Add milestone updates here]\n\n**Upcoming Actions:**\n[Add upcoming actions here]\n\n**Risks / Escalations:**\n'+(ts.bl>0?'• '+ts.bl+' blocked task(s) require resolution':'• No critical blockers at this time')+'\n\nPlease let me know if you have any questions.\n\nRegards,\n[YOUR NAME]';
 }
 // missing tasks
 if(q.indexOf('missing')>=0||q.indexOf('suggest')>=0){
  var hasWS=ev.workstreams?ev.workstreams.map(function(ws){return ws.name;}):[];
  var suggestions=[];
  if(!hasWS.some(function(n){return n.toLowerCase().indexOf('communication')>=0;}))suggestions.push('Consider adding a Communications workstream for invites, reminders, and talk tracks');
  if(!hasWS.some(function(n){return n.toLowerCase().indexOf('grf')>=0||n.toLowerCase().indexOf('venue')>=0;}))suggestions.push('Consider adding a Venue & GRF workstream for room booking and logistics');
  if(!hasWS.some(function(n){return n.toLowerCase().indexOf('it')>=0||n.toLowerCase().indexOf('av')>=0;}))suggestions.push('Consider adding an IT & AV workstream for AV setup and connectivity');
  if(!hasWS.some(function(n){return n.toLowerCase().indexOf('post')>=0;}))suggestions.push('Consider adding a Post-Event workstream for recordings, feedback, and budget reconciliation');
  var noOwner=0;(ev.workstreams||[]).forEach(function(ws){(ws.tasks||[]).forEach(function(t){if(!t.owner)noOwner++;});});
  if(noOwner>0)suggestions.push(noOwner+' task(s) have no owner assigned – ensure all tasks have a named owner');
  var noDueDate=0;(ev.workstreams||[]).forEach(function(ws){(ws.tasks||[]).forEach(function(t){if(!t.dueDate&&t.status!=='Done'&&t.status!=='N/A')noDueDate++;});});
  if(noDueDate>0)suggestions.push(noDueDate+' open task(s) have no due date – add due dates to enable proactive tracking');
  if(!ev.sessions||ev.sessions.length===0)suggestions.push('No agenda sessions added yet – build out the Agenda Planner to share with speakers and facilitators');
  var days=getOrCreateDays(ev);var daysNoHC=days.filter(function(d){return!d.headcount;});
  if(daysNoHC.length>0)suggestions.push(daysNoHC.length+' event day(s) have no headcount set – update Day Schedule in the event editor');
  if(!ev.venues||ev.venues.length===0)suggestions.push('No venues configured – open the event editor and add venues in the Venues & Rooms tab');
  if(!ev.budgetLines||ev.budgetLines.length===0)suggestions.push('No budget lines defined – load the budget template or add line items to track spend');
  if(!ev.logisticsItems||ev.logisticsItems.length===0)suggestions.push('No logistics items defined – load the logistics template to track GRF, IT, stationery, and vendor items');
  if(suggestions.length===0)return'Your event plan looks comprehensive! All major workstreams, agenda, budget, and logistics are set up.\n\nContinue updating task statuses as you progress, and keep an eye on blocked items and budget utilisation.';
  return'Suggestions and Potential Gaps – '+ev.name+':\n\n'+suggestions.map(function(s,i){return(i+1)+'. '+s;}).join('\n\n')+'\n\nWould you like help drafting tasks for any of these areas?';
 }
 // risks
 if(q.indexOf('risk')>=0){
  var risks=[];
  var budPct=bs.total?(bs.act/bs.total*100):0;
  if(ts.bl>0)risks.push('HIGH: '+ts.bl+' task(s) are currently blocked. Escalate to owners immediately to avoid event day impact.');
  if(budPct>=100)risks.push('HIGH: Budget is over the approved limit ('+Math.round(budPct)+'%). Seek approval for additional funds.');
  else if(budPct>=80)risks.push('MEDIUM: Budget is >80% utilised. Review remaining commitments.');
  var pendHighPri=0;(ev.workstreams||[]).forEach(function(ws){(ws.tasks||[]).forEach(function(t){if(t.priority==='High'&&(t.status==='Pending'||t.status==='Blocked'))pendHighPri++;});});
  if(pendHighPri>0)risks.push('MEDIUM: '+pendHighPri+' high-priority task(s) are still pending or blocked.');
  var noOwner=0;(ev.workstreams||[]).forEach(function(ws){(ws.tasks||[]).forEach(function(t){if(!t.owner&&t.status!=='Done'&&t.status!=='N/A')noOwner++;});});
  if(noOwner>0)risks.push('LOW: '+noOwner+' open task(s) have no owner assigned. Unowned tasks are a common cause of last-minute scrambles.');
  if(!ev.sessions||ev.sessions.length===0)risks.push('LOW: No agenda sessions defined. Speakers and facilitators cannot be briefed without a confirmed agenda.');
  var logPending=(ev.logisticsItems||[]).filter(function(i){return i.status==='Pending'&&(i.cat==='GRF'||i.cat==='IT');}).length;
  if(logPending>0)risks.push('MEDIUM: '+logPending+' GRF/IT logistics item(s) are still pending. These typically require lead time – raise requests early.');
  if(risks.length===0)return'No significant risks identified at this stage. The event plan looks healthy.\n\nContinue to monitor task progress, budget, and logistics as you approach the event date.';
  return'Event Risk Summary – '+ev.name+':\n\n'+risks.map(function(r){return'⚠ '+r;}).join('\n\n')+'\n\nAddress high-priority risks as soon as possible.';
 }
 // logistics
 if(q.indexOf('logistic')>=0){
  var items=ev.logisticsItems||[];
  if(items.length===0)return'No logistics items have been added yet for '+ev.name+'.\n\nNavigate to the Logistics Tracker and load the standard template to get 23 pre-built checklist items covering GRF, IT, stationery, vendor, and printing.';
  var pend=items.filter(function(i){return i.status==='Pending';});
  var conf=items.filter(function(i){return i.status==='Confirmed'||i.status==='Received';});
  var ord=items.filter(function(i){return i.status==='Ordered';});
  return'Logistics Status – '+ev.name+':\n\n'+items.length+' total items\n• Confirmed / Received: '+conf.length+'\n• Ordered: '+ord.length+'\n• Pending: '+pend.length+'\n\n'+(pend.length>0?'Items still pending:\n'+pend.slice(0,8).map(function(i){return'  • ['+i.cat+'] '+i.name+(i.owner?' ('+i.owner+')':'');}).join('\n'):'All items are confirmed or ordered – great progress!');
 }
 // default
 return'I can help you with the following for '+ev.name+':\n\n• "What is the task completion status?" – full workstream breakdown\n• "Which tasks are blocked?" – blocked task list\n• "Summarise the budget health" – budget analysis\n• "Draft a status update for leadership" – ready-to-send email\n• "What tasks might be missing?" – gap analysis\n• "What are the key risks?" – risk identification\n• "Which logistics items need attention?" – logistics review\n\nPlease try one of the suggestions above or ask a specific question.';
}
/* =====================================================================
   AFTER RENDER & INIT
   ===================================================================== */
function afterRender(){
 // nothing special needed currently
}
function init(){
 load();
 if(ST.curId&&!ST.events.find(function(e){return e.id===ST.curId;}))ST.curId=null;
 popSel();renderAll();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
